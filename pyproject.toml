[project]
name = "lm-studio-remote"
version = "0.1.0"
description = "LM Studio remote tui"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.16.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
